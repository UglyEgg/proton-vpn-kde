name: Source CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fedora:
    name: Fedora 44 build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: fedora:44

    steps:
      - name: Install build and analysis dependencies
        run: |
          dnf install -y \
            ShellCheck cmake cpio curl dbus-daemon desktop-file-utils libxml2 rpm \
            extra-cmake-modules gcc-c++ git glib2 ninja-build openssl-devel \
            python3-coverage python3-cryptography python3-dbus-fast \
            python3-mypy ruff \
            kf6-kconfig-devel kf6-kcoreaddons-devel \
            kf6-kglobalaccel-devel kf6-kcmutils-devel \
            kf6-knotifications-devel kf6-krunner-devel \
            kf6-kservice-devel kf6-kstatusnotifieritem-devel \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-linguist

      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run static checks
        run: scripts/check-static-analysis.sh

      - name: Run Python type and coverage analysis
        run: scripts/check-python-analysis.sh

      - name: Verify minimum Proton Core contract
        run: scripts/check-core-compatibility.sh

      - name: Configure
        run: cmake -S . -B build -G Ninja -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        env:
          CTEST_OUTPUT_ON_FAILURE: "1"
        run: ctest --test-dir build --output-on-failure --parallel 2

  native-analysis:
    name: Clang analysis and sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: fedora:44

    steps:
      - name: Install native analysis dependencies
        run: |
          dnf install -y \
            clang clang-tools-extra cmake compiler-rt dbus-daemon \
            extra-cmake-modules git ninja-build openssl-devel \
            python3-cryptography python3-dbus-fast \
            kf6-kconfig-devel kf6-kcoreaddons-devel \
            kf6-kglobalaccel-devel kf6-kcmutils-devel \
            kf6-knotifications-devel kf6-krunner-devel \
            kf6-kservice-devel kf6-kstatusnotifieritem-devel \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-linguist

      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build and test with Clang sanitizers
        run: scripts/check-native-sanitizers.sh

      - name: Run Clang-Tidy
        run: scripts/check-clang-tidy.sh

  python-minimum:
    name: Python 3.11 minimum dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install hash-pinned minimum dependencies
        run: |
          python -m pip install \
            --only-binary=:all: \
            --require-hashes \
            --requirement backend/requirements-minimum.txt

      - name: Run the backend suite
        env:
          PYTHONPATH: backend
        run: |
          python -m compileall -q backend/proton_vpn_kde_backend
          python -m unittest discover -s backend/tests
