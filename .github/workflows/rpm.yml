name: RPM Package

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: rpm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fedora-rpm:
    name: Fedora 44 RPM
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: fedora:44
    env:
      RPM_TOPDIR: ${{ github.workspace }}/rpm-build
      KEYRING_RPM_TOPDIR: ${{ github.workspace }}/keyring-rpm-build
      API_CORE_RPM_TOPDIR: ${{ github.workspace }}/api-core-rpm-build
      RELEASE_ARTIFACT_DIR: ${{ github.workspace }}/release-artifacts

    steps:
      - name: Install RPM build dependencies
        run: |
          dnf install -y \
            cmake cpio curl dbus-daemon desktop-file-utils \
            extra-cmake-modules gcc-c++ git glib2 ninja-build openssl-devel \
            NetworkManager-libnm \
            pyproject-rpm-macros python3-cryptography python3-dbus-fast \
            python3-coverage python3-devel python3-distro python3-fido2 \
            python3-gobject python3-jinja2 python3-keyring python3-mypy \
            python3-packaging python3-pytest \
            python3-pynacl python3-secretstorage python3-sentry-sdk \
            python3-setuptools procps-ng ripgrep rpm-build shadow-utils \
            kf6-kconfig-devel kf6-kcoreaddons-devel \
            kf6-kglobalaccel-devel kf6-kcmutils-devel \
            kf6-knotifications-devel kf6-krunner-devel \
            kf6-kservice-devel kf6-kstatusnotifieritem-devel \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-linguist

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install signed Proton Core build dependency
        shell: bash
        run: |
          manifest=packaging/fedora/api-core-overlay/overlay-manifest.json
          repository_url="$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["vendor"]["rpmRepositoryUrl"])' \
            "$manifest")"
          signing_key_url="$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["vendor"]["signingKey"]["url"])' \
            "$manifest")"
          signing_key_name="$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["vendor"]["signingKey"]["filename"])' \
            "$manifest")"
          signing_key_sha256="$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["vendor"]["signingKey"]["sha256"])' \
            "$manifest")"
          signing_key_path="/tmp/$signing_key_name"
          curl --fail --location --silent --show-error \
            --output "$signing_key_path" "$signing_key_url"
          actual_signing_key_sha256="$(sha256sum "$signing_key_path" | cut -d ' ' -f 1)"
          [[ "$actual_signing_key_sha256" == "$signing_key_sha256" ]]
          rpmkeys --import "$signing_key_path"
          dnf install -y \
            --repofrompath="proton-build,$repository_url" \
            --setopt=proton-build.gpgcheck=1 \
            --setopt="proton-build.gpgkey=file://$signing_key_path" \
            'python3-proton-core >= 0.5.0'

      - name: Trust the container workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Prepare unprivileged builder
        run: |
          useradd --create-home ci-builder
          chown -R ci-builder:ci-builder "$GITHUB_WORKSPACE"

      - name: Build provider-neutral keyring overlay
        run: |
          runuser --user ci-builder -- \
            packaging/fedora/keyring-overlay/build_overlay_rpm.sh \
              '' "$KEYRING_RPM_TOPDIR"

      - name: Build Plasma-compatible API Core overlay
        run: |
          runuser --user ci-builder -- \
            packaging/fedora/api-core-overlay/build_overlay_rpm.sh \
              '' "$API_CORE_RPM_TOPDIR" \
              /tmp/protonvpn-fedora-44-public-key.asc

      - name: Create source archive
        run: |
          runuser --user ci-builder -- \
            packaging/fedora/prepare-rpmbuild-tree.sh "$RPM_TOPDIR"

      - name: Build source and binary RPMs
        env:
          TMPDIR: ${{ env.RPM_TOPDIR }}/TMP
        run: |
          runuser --user ci-builder -- \
            rpmbuild \
              --define "_topdir $RPM_TOPDIR" \
              --define "_tmppath $RPM_TOPDIR/TMP" \
              --define "_smp_build_ncpus 2" \
              -ba "$RPM_TOPDIR/SPECS/proton-vpn-kde.spec"

      - name: Inspect package artifacts
        run: |
          mapfile -t binary_rpms < <(
            find "$RPM_TOPDIR/RPMS" -type f -name 'proton-vpn-kde-[0-9]*.rpm' -print
          )
          mapfile -t source_rpms < <(
            find "$RPM_TOPDIR/SRPMS" -type f -name 'proton-vpn-kde-*.src.rpm' -print
          )
          [[ ${#binary_rpms[@]} -eq 1 ]]
          [[ ${#source_rpms[@]} -eq 1 ]]
          mapfile -t keyring_rpms < <(
            find "$KEYRING_RPM_TOPDIR/RPMS" -type f \
              -name 'python3-proton-keyring-linux-*.noarch.rpm' -print
          )
          mapfile -t keyring_source_rpms < <(
            find "$KEYRING_RPM_TOPDIR/SRPMS" -type f \
              -name 'python3-proton-keyring-linux-*.src.rpm' -print
          )
          [[ ${#keyring_rpms[@]} -eq 1 ]]
          [[ ${#keyring_source_rpms[@]} -eq 1 ]]
          mapfile -t api_core_rpms < <(
            find "$API_CORE_RPM_TOPDIR/RPMS" -type f \
              -name 'python3-proton-vpn-api-core-*.x86_64.rpm' -print
          )
          mapfile -t api_core_source_rpms < <(
            find "$API_CORE_RPM_TOPDIR/SRPMS" -type f \
              -name 'python3-proton-vpn-api-core-*.src.rpm' -print
          )
          [[ ${#api_core_rpms[@]} -eq 1 ]]
          [[ ${#api_core_source_rpms[@]} -eq 1 ]]
          scripts/check-rpm-artifact.sh "${binary_rpms[0]}"
          packaging/fedora/keyring-overlay/check_overlay_rpm.sh \
            "${keyring_rpms[0]}"
          rpm -qpi "${source_rpms[0]}"
          rpm -qpi "${keyring_source_rpms[0]}"
          rpm -qpi "${api_core_source_rpms[0]}"
          rpm -Uvh --test --nodeps --ignoresize \
            "${keyring_rpms[0]}" "${api_core_rpms[0]}" \
            "${binary_rpms[0]}"

      - name: Stage release artifacts
        run: |
          mapfile -t binary_rpms < <(
            find "$RPM_TOPDIR/RPMS" -type f -name 'proton-vpn-kde-[0-9]*.rpm' -print
          )
          mapfile -t source_rpms < <(
            find "$RPM_TOPDIR/SRPMS" -type f -name 'proton-vpn-kde-*.src.rpm' -print
          )
          mapfile -t keyring_rpms < <(
            find "$KEYRING_RPM_TOPDIR/RPMS" -type f \
              -name 'python3-proton-keyring-linux-*.noarch.rpm' -print
          )
          mapfile -t keyring_source_rpms < <(
            find "$KEYRING_RPM_TOPDIR/SRPMS" -type f \
              -name 'python3-proton-keyring-linux-*.src.rpm' -print
          )
          mapfile -t api_core_rpms < <(
            find "$API_CORE_RPM_TOPDIR/RPMS" -type f \
              -name 'python3-proton-vpn-api-core-*.x86_64.rpm' -print
          )
          mapfile -t api_core_source_rpms < <(
            find "$API_CORE_RPM_TOPDIR/SRPMS" -type f \
              -name 'python3-proton-vpn-api-core-*.src.rpm' -print
          )
          [[ ${#binary_rpms[@]} -eq 1 ]]
          [[ ${#source_rpms[@]} -eq 1 ]]
          [[ ${#keyring_rpms[@]} -eq 1 ]]
          [[ ${#keyring_source_rpms[@]} -eq 1 ]]
          [[ ${#api_core_rpms[@]} -eq 1 ]]
          [[ ${#api_core_source_rpms[@]} -eq 1 ]]
          install -d -m 0755 "$RELEASE_ARTIFACT_DIR"
          install -m 0644 \
            "${binary_rpms[0]}" \
            "${source_rpms[0]}" \
            "${keyring_rpms[0]}" \
            "${keyring_source_rpms[0]}" \
            "${api_core_rpms[0]}" \
            "${api_core_source_rpms[0]}" \
            "$RELEASE_ARTIFACT_DIR/"
          [[ $(find "$RELEASE_ARTIFACT_DIR" -maxdepth 1 -type f -name '*.rpm' | wc -l) -eq 6 ]]

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: proton-vpn-kde-fedora-44
          path: ${{ env.RELEASE_ARTIFACT_DIR }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
